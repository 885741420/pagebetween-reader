    <div class="chapter-content">
      <p>灯光落在纸面上，刚才读过的句子仍然留在记忆里。窗口缩小以后，文字也会跟随空间重新排布。</p>
      <p>左右方向键可以让读者在章节之间移动。阅读器会优先使用已经缓存的内容，因此切换时无需再次等待网页。</p>
      <p>正文不会离开用户的电脑，浏览器和阅读器只通过本机地址交换数据。</p>
